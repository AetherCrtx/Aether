# AetherTerminal Theme & Keybindings Configuration
# Default Theme: Tokyo Night Dark

[theme]
name = "Tokyo Night Dark"
background = "#1a1b26"
foreground = "#c0caf5"
cursor = "#c0caf5"
selection_background = "#283457"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright_black = "#414868"
bright_red = "#f7768e"
bright_green = "#9ece6a"
bright_yellow = "#e0af68"
bright_blue = "#7aa2f7"
bright_magenta = "#bb9af7"
bright_cyan = "#7dcfff"
bright_white = "#c0caf5"

[font]
family = "JetBrainsMono Nerd Font, FiraCode Nerd Font, monospace"
size = 13.0
line_height = 1.2

[keybindings]
split_vertical = "Alt+V"
split_horizontal = "Alt+S"
close_pane = "Alt+W"
focus_left = "Alt+H"
focus_down = "Alt+J"
focus_up = "Alt+K"
focus_right = "Alt+L"
orchestrator_bar = "Ctrl+Space"
diff_gatekeeper = "Alt+M"
time_travel = "Alt+Z"
obsidian_sidebar = "Ctrl+B"
